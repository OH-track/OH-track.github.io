<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B6E99">
<title>OH Tracker</title>
<style>
  :root { --brand:#0B6E99; --dark:#084C6B; --ink:#1B2733; --muted:#7B8794; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
    background: linear-gradient(160deg, var(--dark), var(--brand));
  }
  .card {
    width: min(92vw, 420px); background: #fff; border-radius: 24px; padding: 32px 24px 26px;
    text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 18px; background: rgba(11,110,153,.12);
    display: grid; place-items: center; font-size: 32px;
  }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.3px; }
  p.sub { margin: 0 0 26px; color: var(--muted); }
  a.btn {
    display: block; padding: 17px 18px; margin-top: 12px; border-radius: 16px; text-decoration: none;
    font-weight: 700; font-size: 17px;
  }
  a.primary { background: var(--brand); color: #fff; }
  a.secondary { background: #fff; color: var(--brand); border: 2px solid rgba(11,110,153,.35); font-size: 15px; padding: 13px 18px; }
  a.btn small { display: block; font-weight: 500; font-size: 12.5px; opacity: .8; margin-top: 2px; }
  .hint { margin: 22px 0 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">&#128736;</div>
    <h1>OH Tracker</h1>
    <p class="sub">Button bar tracker</p>

    <a id="primary" class="btn primary" href="#"></a>
    <a id="secondary" class="btn secondary" href="#"></a>

    <p class="hint">
      If one link does not open on your network, try the other.<br>
      You will be asked for the team access code.
    </p>
  </main>

<script>
  // The only place to edit when the app's address changes.
  const LINKS = {
    primary:   { label: "Open the tracker",       note: "Direct link", url: "http://3.106.33.233:8100" },
    secondary: { label: "Open the secure (HTTPS) link", note: "", url: "https://3-106-33-233.sslip.io" },
  };
  for (const key of ["primary", "secondary"]) {
    const el = document.getElementById(key), l = LINKS[key];
    el.href = l.url;
    el.innerHTML = l.label + (l.note ? "<small>" + l.note + "</small>" : "");
  }
</script>
</body>
</html>
